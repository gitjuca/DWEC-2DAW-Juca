<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baraja</title>
    <link rel="stylesheet" href="estilo.css">
</head>
<body>
    <h1>Mesa de Cartas</h1>
    
    <div class="controles">
        <button id="btnCrear">Crear</button>
        <button id="btnBarajar">Barajar</button>
        <button id="btnCortar">Cortar</button>
        <button id="btnRobar">Robar</button>
    </div>

    <div id="mesa">
        <div id="mazo-container">
            <img id="mazo-img" src="./img/mazoCartas.jpg" alt="Mazo de cartas">
            <div class="info">Cartas restantes: <span id="num-cartas">0</span></div>
        </div>
        
        <div id="div-cartas-robadas"></div>
    </div>

    <script src="baraja.js"></script>
</body>
</html>
