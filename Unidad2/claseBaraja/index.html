<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baraja</title>
    <link rel="stylesheet" href="estilo.css">
</head>
<body>
    <h1>Baraja de Cartas</h1>
    
    <div class="controles">
        <button id="btnCrear">Crear</button>
        <button id="btnBarajar">Barajar</button>
        <button id="btnCortar">Cortar</button>
        <button id="btnRobar">Robar</button>
    </div>

    <div id="mesa">
        <div id="mazoContainer">
            <img id="mazoImg" src="./img/mazoCartas.jpg" alt="Mazo de cartas">
            <div>Cartas restantes: <span id="numCartas">0</span></div>
        </div>
        
        <div id="cartasRobadas"></div>
    </div>

    <script src="baraja.js"></script>
</body>
</html>
